name = "lms-api"
main = "src/index.ts"
compatibility_date = "2024-11-15"

# Workers configuration
[observability]
enabled = true

# Environment variables (set these via wrangler secret put)
# DATABASE_URL
# ANTHROPIC_API_KEY
# OPENAI_API_KEY
# WHATSAPP_TOKEN
# WHATSAPP_VERIFY_TOKEN

# Development
[env.development]
name = "lms-api-dev"

# Production
[env.production]
name = "lms-api-prod"
routes = [
  { pattern = "api.skillhub.co.ke/*", zone_name = "skillhub.co.ke" }
]
