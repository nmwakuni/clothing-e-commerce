name = "lms-api"
main = "src/index.ts"
compatibility_date = "2024-11-15"

# Workers configuration
[observability]
enabled = true

# Environment variables (set these via wrangler secret put)
# Required secrets - set using: wrangler secret put <NAME>
# - DATABASE_URL
# - JWT_SECRET
# - ANTHROPIC_API_KEY
# - OPENAI_API_KEY
# - WHATSAPP_ACCESS_TOKEN
# - WHATSAPP_PHONE_ID
# - WHATSAPP_VERIFY_TOKEN
# - MPESA_CONSUMER_KEY
# - MPESA_CONSUMER_SECRET
# - MPESA_SHORTCODE
# - MPESA_PASSKEY
# - MPESA_ENVIRONMENT (sandbox or production)
# - MPESA_CALLBACK_URL

# Compatibility flags for Node.js APIs
compatibility_flags = ["nodejs_compat"]

# Development
[env.development]
name = "lms-api-dev"

# Production
[env.production]
name = "lms-api-prod"
routes = [
  { pattern = "api.skillhub.co.ke/*", zone_name = "skillhub.co.ke" }
]
